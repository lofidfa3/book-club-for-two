map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    client_max_body_size 200m;

    # Book club companion app
    location /bookclub/ {
        proxy_pass http://companion:8000/;
        proxy_read_timeout 300s;                         # book downloads/uploads can take a while
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Kavita, with the love-notes overlay injected into its pages
    location / {
        proxy_pass http://kavita:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;          # SignalR websockets
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;

        proxy_set_header Accept-Encoding "";             # sub_filter needs uncompressed HTML
        sub_filter_once on;
        sub_filter '</body>' '<script src="/bookclub/static/love.js" defer></script></body>';
    }
}
