<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Our Book Club{% endblock %}</title>
  <link rel="stylesheet" href="{{ BASE }}/static/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
</head>
<body>
  {% if me %}
  <header class="top">
    <a class="brand" href="{{ BASE }}/">📖 Our Book Club</a>
    <nav>
      <a href="{{ BASE }}/">Home</a>
      <a href="{{ BASE }}/choose">Books</a>
      <a href="{{ BASE }}/add">Add a book</a>
      <a href="{{ BASE }}/love">Love notes 💌</a>
      <a href="/">Open Kavita ↗</a>
      <a class="muted" href="{{ BASE }}/logout">Log out</a>
    </nav>
  </header>
  {% endif %}
  <main>{% block body %}{% endblock %}</main>
</body>
</html>
